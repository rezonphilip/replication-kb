distinguishing_checks:
- check: Call ComINT GetDbConfigurationDetails health/route from the server running the failing service (do not paste the response; it contains connection strings).
  if_true: unreachable or error -> fix ComINT (IIS site, app pool, its own DB access)
  if_false: returns data -> check the replica type id exists and its connection strings are filled (presence only)
- check: Open the failing service services.json and check the ComINT entry (base address and endpoint names only).
  if_true: missing/wrong -> restore from deployment
  if_false: present -> ComINT side
solutions:
- id: SOL-IREP-CFG-001-A
  title: Restore ComINT or its endpoint configuration
  when: Gateway unreachable or misconfigured.
  steps:
  - do: Start/restart the ComINT site and check ComINTServiceLog_.txt.
    who: support
    requires_approval: true
    verify: Route answers.
  - do: Correct services.json entries of the calling service from the deployment template.
    who: dev
    requires_approval: true
    verify: Calling service logs no configuration error on next cycle.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-IREP-CFG-001-B
  title: Complete the replica type configuration
  when: ComINT answers but the replica type has no or empty connection strings.
  steps:
  - do: Dev/DBA fills the replica configuration through the documented procedure; never paste values into tickets.
    who: dev
    requires_approval: true
    verify: Presence script shows PRESENT for each database.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
notes: 'Security: ComINT returns connection strings over HTTP, and some services log the connection string in "Invalid connectionString settings" — treat those logs as sensitive.'
