symptoms:
- A sync+ service logs "not able to fetch database connectionString configurations" or "Invalid connectionString settings" every cycle.
- '"Service ComINT_Utility not found on services.json" or a ComINT HTTP exception appears.'
- All sync+ work for one replica type stops at once.
phrasings:
- comint not reachable
- cannot fetch connection string
- connectionstring configurations not fetched
- invalid connectionString settings
- ComINT_Utility not found on services.json
- services.json missing entry
- GetDbConfigurationDetails failed
- config gateway down
- irep all services failing config
- sync+ db config missing
- replica type not configured
- connection settings null
- Connectionstring settings not found
- after server move irep stopped
- comint 500
- comint timeout
- com int service down
- conection string not found
- no replica type config
- smartsync+ cannot connect to db
- GetConnectionStrings failed
