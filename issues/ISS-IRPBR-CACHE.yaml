distinguishing_checks:
- check: Check DataConduitSettings:ConduitType (StaticData or RedisCache) and, for Redis, that the cache server is reachable.
  if_true: Redis unreachable -> infrastructure
  if_false: static/in-memory -> data is rebuilt from DB; check the DB step
- check: After a configuration change, check whether the cache was cleared (ClearAllCache/DeleteAllCacheKeys routes).
  if_true: not cleared -> clear and observe
  if_false: cleared -> the DB value itself is wrong
solutions:
- id: SOL-IRPBR-CACHE-A
  title: Clear the service cache
  when: Cached data is stale or corrupt.
  steps:
  - do: Call the documented cache-clear route for the service and replica type.
    who: support
    requires_approval: true
    verify: Next cycle reads fresh data.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-IRPBR-CACHE-B
  title: Restore cache server
  when: Redis is not reachable.
  steps:
  - do: Escalate to infrastructure with the cache host name from configuration (do not paste credentials).
    who: support
    requires_approval: false
    verify: Cache reachable.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
