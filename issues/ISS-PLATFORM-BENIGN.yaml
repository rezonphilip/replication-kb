id: ISS-PLATFORM-BENIGN
title: Status lines logged at Error/Warning level that are not failures
status: draft
author: claude
reviewed_by: ''
last_verified: '2026-11-11'
mechanism:
- irep
- priority-replication
- smartsync
runs_on:
- office
- vessel
components:
- ComINT
- ExportCDT
- ExportDCS
- ImportDES
- ImportRBP
- ComPBR
- RepDBLogW
- RepAckn
- RepFileMerge
error_types:
- benign
related_docs:
- PLT-IREP
- PLT-MSREP-OVERVIEW
symptoms:
- Log contains Error-level lines such as "Process started", "CACHE_CHEKING", "Awaiter Insert status", "Deleted entry ... successfully" or "END:" while replication works.
phrasings:
- process started error in log
- CACHE_CHEKING error
- awaiter insert status error
- is this error real
- false error in log
- error lines but working
- default delay of 15 mins
- deleted entry successfully error
- move back process successfully
- DcsServiceCallAsync End error
- StartRepImportSync error
- Process Reinitiated
- treating update as successful
- duplicate key detected and ignored
- single-row fallback succeeded
- skipped packet already exists treating as success
- truncated response message
- 'INFO: logged as error'
- 'END: AzureDblog'
- harmless errors
- ignore these errors?
