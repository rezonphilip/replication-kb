distinguishing_checks:
- check: Does the line match one of the benign signatures and is the queue moving?
  if_true: yes -> ignore; the dashboard suppresses it
  if_false: no -> use the class card for the line
solutions:
- id: SOL-PLATFORM-BENIGN-A
  title: No action
  when: Status line only.
  steps:
  - do: Ignore; dashboard suppresses these lines.
    who: support
    requires_approval: false
    verify: Queues move normally.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
