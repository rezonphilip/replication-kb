distinguishing_checks:
- check: Identify table id/name from the log and compare the column list on both sides (sender query vs receiver table).
  if_true: column/type differs -> schema drift; align schema
  if_false: same -> check the query configuration for the table
- check: For change tracking errors, check that change tracking is enabled on the source database and table.
  if_true: not enabled -> enable it (DBA) and re-run
  if_false: enabled -> check the configured query text
solutions:
- id: SOL-IRIMP-DATAAPPLY-A
  title: Align schema or configuration
  when: Table structure or configured query does not match.
  steps:
  - do: Record table id/name and the exact SQL message.
    who: support
    requires_approval: false
    verify: Details recorded.
  - do: DBA/dev aligns the table or the configured query; rerun the cycle.
    who: dev
    requires_approval: true
    verify: No new errors for the table; rows applied.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-IRIMP-DATAAPPLY-B
  title: Reprocess skipped rows
  when: Rows were skipped after the fix.
  steps:
  - do: Use the documented reprocess route/table for the replica type.
    who: dev
    requires_approval: true
    verify: Skipped rows applied.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
