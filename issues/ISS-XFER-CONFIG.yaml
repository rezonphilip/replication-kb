solutions:
- id: SOL-XFER-CONFIG-A
  title: Restore missing configuration
  when: A setting, parameter or settings row is missing or empty.
  steps:
  - do: Name the missing key from the log.
    who: support
    requires_approval: false
    verify: Key named.
  - do: Dev/ops restores it from the deployment source; never paste secret values.
    who: dev
    requires_approval: true
    verify: EvaluateConfig/presence script shows it present.
  - do: Restart or clear cache if the service caches configuration.
    who: support
    requires_approval: true
    verify: Next cycle passes the configuration step.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
