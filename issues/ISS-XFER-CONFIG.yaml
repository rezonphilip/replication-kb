distinguishing_checks:
- check: Use the service EvaluateConfig/ConfigEvaluation route (if present) or the read-only presence scripts to list missing settings (names only).
  if_true: missing -> restore from the deployment template/source
  if_false: all present -> check values point to the right server/folder
- check: Compare with a working site of the same version.
  if_true: differs -> configuration drift
