distinguishing_checks:
- check: Compare the last packet number sent by the sender with the last packet number applied by the receiver for the vessel (read-only queries in the data articles).
  if_true: gap exists -> a packet is missing or failed; find it in the error/skip lists
  if_false: no gap -> look at the receiver queue status instead
- check: Search the receiver error folder and the skipped/error packet tables for the missing counter.
  if_true: packet is there -> fix its cause (see PACKET/DATAAPPLY cards) and reprocess
  if_false: packet never arrived -> request a resend from the sender
solutions:
- id: SOL-IRIMP-SEQUENCE-A
  title: Get the missing packet re-sent
  when: One or more counters are missing on the receiving side.
  steps:
  - do: Identify vessel, replica/channel and the first missing counter from the log line.
    who: support
    requires_approval: false
    verify: Counter and vessel known.
  - do: Trigger the resend for that counter through the documented resend route or table (never edit counters by hand).
    who: dev
    requires_approval: true
    verify: Packet arrives and the counter advances.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-IRIMP-SEQUENCE-B
  title: Release an old or duplicate packet
  when: The packet number is lower than or equal to the last applied one.
  steps:
  - do: Confirm the packet really was applied before (status tables).
    who: support
    requires_approval: false
    verify: Applied status found.
  - do: Let the service move it to the error/old folder; no data action needed.
    who: support
    requires_approval: false
    verify: No repeat of the message for that counter.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
