distinguishing_checks:
- check: 'Look up the table id from the log in REP_EXPORT_VESSEL_QUERY (read-only): are the office/vessel insert and delete query columns filled?'
  if_true: empty -> the query row is incomplete
  if_false: filled -> run the query text in a test session (read-only SELECT part) to see the SQL error
- check: Is the message "MaxId 0"?
  if_true: MaxId 0 -> no new changes were captured; usually not an error unless changes are expected (see ISS-IREP-CDT-001)
  if_false: otherwise -> query/config problem
solutions:
- id: SOL-IREP-CDT-002-A
  title: Correct the export query row
  when: Query missing or invalid.
  steps:
  - do: Record the REP_EXPORT_VESSEL_QUERY id, table id and SQL text.
    who: support
    requires_approval: false
    verify: Details recorded.
  - do: Dev corrects the query through the deployment script for the version and clears the CDT cache (ClearCacheEnabled or cache-clear route).
    who: dev
    requires_approval: true
    verify: Next cycle logs no skip/SQL error for the table.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
