id: ISS-IREP-CDT-002
title: 'sync+ export: export query in REP_EXPORT_VESSEL_QUERY missing, invalid or skipped'
status: draft
author: claude
reviewed_by: ''
last_verified: '2026-11-11'
mechanism:
- irep
runs_on:
- office
- vessel
components:
- ExportCDT
error_types:
- dataapply
- config
related_docs:
- CMP-EXPORTCDT
- FLW-IREP-EXPORT
- DATA-IREP
symptoms:
- Tables are skipped every cycle with "Query not found, skipping", "TableId 0, skipping" or "MaxId 0, skipping".
- SQL errors such as "multi-part identifier could not be bound" or "invalid column name" for the vessel export query.
- Changes reach REP_RECORD_SYNC but no rows are written for vessels (record vessel sync).
phrasings:
- export query missing
- query not found skipping
- REP_EXPORT_VESSEL_QUERY wrong
- vessel query error
- multi-part identifier could not be bound
- invalid column in export query
- TableId 0 skipping
- MaxId 0 skipping
- off export query wrong
- vsl export query wrong
- delete query missing
- deleted records not replicating sync+
- record vessel sync not filled
- irep vessel data not routed
- table not going to vessel
- sync+ query config error
- after adding table to irep nothing sent
- export query typo
- exprot query mising
- wrong alias in export query
- routing query fails for vessel
