id: ISS-IREP-RBP-001
title: 'sync+ import: RBP cannot apply rows to PAL (not enabled, table/endpoint missing, application API fails)'
status: draft
author: claude
reviewed_by: ''
last_verified: '2026-11-11'
mechanism:
- irep
runs_on:
- office
- vessel
components:
- ImportRBP
error_types:
- dataapply
- http
related_docs:
- CMP-IMPORTRBP
- FLW-IREP-IMPORT
symptoms:
- Rows stay in REP2I _REP / _REP_DEL tables and never reach PAL.
- Logs "RBP not enabled for ReplicaTypeId", "Table name not found for TableId", "API call failed for table" or the HTTP status of the application endpoint.
phrasings:
- rbp not enabled
- rows stuck in rep2i
- rep table not emptied
- api call failed for table
- application endpoint failed
- table name not found for tableid
- simulated api call failed
- rbp http error
- endpoint details missing
- USP_GetEndPointDetails empty
- data imported but not visible in pal
- rbp reprocess error
- batch delete failed rbp
- processed rows not deleted
- rbp stuck
- irep apply failed
- data not applied ship sync+
- data not applied office irep
- rpb not working
- rbp 500
