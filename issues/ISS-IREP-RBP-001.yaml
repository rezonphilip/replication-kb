distinguishing_checks:
- check: Is RBP enabled for the replica type (configuration flag, presence only)?
  if_true: no -> enable per deployment decision
  if_false: yes -> check endpoint rows for the table id
- check: Does the endpoint (USP_GetEndPointDetails) return base URL and API for the table, and does the application API answer?
  if_true: missing -> configure endpoint
  if_false: API error -> application side; read the HTTP status
solutions:
- id: SOL-IREP-RBP-001-A
  title: Configure or restore the application endpoint
  when: Endpoint missing or failing.
  steps:
  - do: Dev configures endpoint rows for the table or restores the application API.
    who: dev
    requires_approval: true
    verify: API call succeeds; _REP rows are deleted after processing.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-IREP-RBP-001-B
  title: Enable RBP for the replica type
  when: RBP disabled.
  steps:
  - do: Dev/ops enables RBP after confirming it is intended for this site.
    who: dev
    requires_approval: true
    verify: RBP processes the queue.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
notes: The method named SimulateApiCall performs a real HTTP POST; its log line includes the response body — treat as sensitive.
