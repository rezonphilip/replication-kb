id: ISS-IREP-DCS-002
title: 'sync+: vessel configuration invalid — vessel added to failed/skip list'
status: draft
author: claude
reviewed_by: ''
last_verified: '2026-11-11'
mechanism:
- irep
runs_on:
- office
- vessel
components:
- ExportDCS
- ImportDES
error_types:
- config
related_docs:
- CMP-EXPORTDCS
- CMP-IMPORTDES
- CFG-IREP
symptoms:
- One vessel never gets packets (export) or its packets are never validated (import) while others work.
- Logs "Config Status is false for Vessel … adding it to failed Vessel", "basic configuration does not exist skipping", or path configuration errors for the vessel.
- Typical after onboarding a new vessel or changing its folder paths.
phrasings:
- vessel config path invalid
- vessel added to failed list
- vessel skip list
- one vessel not replicating sync+
- new vessel not getting packets
- vessel basic configuration does not exist
- error while path configuration for vessel
- vessel config info error
- no vessel config path data
- environment default config paths not found
- vessel skipped every cycle
- irep new ship setup
- vesel config missing
- outbox path wrong for vessel
- inbox path wrong for vessel
- vessel folder not configured
- only one ship failing irep
- import skipped for vessel
- export skipped for vessel
- invalid config vessel skip list
