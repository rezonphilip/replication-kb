distinguishing_checks:
- check: 'Run the read-only vessel configuration presence check for the vessel (paths and basic configuration rows: PRESENT/EMPTY/MISSING).'
  if_true: missing/empty -> complete the vessel setup
  if_false: present -> check the folders exist and the service account can write
- check: Does the failure clear after the service reset interval or restart?
  if_true: yes, then returns -> configuration really invalid
  if_false: stays cleared -> transient (folder briefly unavailable)
solutions:
- id: SOL-IREP-DCS-002-A
  title: Complete vessel configuration
  when: Vessel rows or paths missing.
  steps:
  - do: Dev/ops adds the missing vessel configuration rows/paths via the onboarding procedure.
    who: dev
    requires_approval: true
    verify: Presence check shows PRESENT.
  - do: Clear the skip/failed list by cache clear or restart.
    who: support
    requires_approval: true
    verify: Vessel processed in the next cycle.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
