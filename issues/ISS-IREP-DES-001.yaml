id: ISS-IREP-DES-001
title: 'sync+ import: packet name does not match this environment (unique code, destination, type, counter, extension) or split incomplete'
status: draft
author: claude
reviewed_by: ''
last_verified: '2026-11-11'
mechanism:
- irep
runs_on:
- office
- vessel
components:
- ImportDES
error_types:
- packet
- config
related_docs:
- CMP-IMPORTDES
- FLW-IREP-IMPORT
symptoms:
- Packets arrive in the inbox but are moved to the error folder or kept waiting.
- Validation fails on unique code, destination, type, packet counter or the .tzst extension; or "Incomplete packet split".
phrasings:
- packet name invalid
- unique code does not match
- destination does not match vessel id
- type does not match replication type
- extension not tzst
- incomplete packet split
- expected splits not found
- packet moved to error folder des
- wrong packet received irep
- packet for other vessel
- packet validation failed
- des validate failed
- import not starting packet in inbox
- split files missing
- packet counter in name wrong
- tzst invalid
- pakcet name mismatch
- packets from test env in prod
- restored db packets rejected
- smartsync+ packets rejected on ship
