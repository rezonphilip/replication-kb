distinguishing_checks:
- check: Split the packet file name into its parts and compare unique code and destination with this environment (presence/identity check).
  if_true: mismatch -> packet routed to the wrong site or environment identity changed
  if_false: match -> check counter and split parts
- check: Count split files for the packet in the inbox.
  if_true: fewer than expected -> transfer still running or incomplete; wait or request resend
  if_false: all present -> name/type validation problem
solutions:
- id: SOL-IREP-DES-001-A
  title: Route or resend correctly
  when: Packet belongs elsewhere or is incomplete.
  steps:
  - do: Do not import packets for another environment; move them out of the inbox after recording names.
    who: support
    requires_approval: true
    verify: Inbox only holds valid packets.
  - do: Request resend from the sender for incomplete packets.
    who: dev
    requires_approval: true
    verify: Complete packet validates.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
notes: These messages are thrown exceptions; the visible log line is the caller catch, so search by the text.
