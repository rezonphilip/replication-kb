distinguishing_checks:
- check: Is RepIntegration (Integration/TransferGeneral) reachable from the DCS server, and is RepTransfer running?
  if_true: no -> restore those services (see ISS-INTEG-001, ISS-TRANSFER-001)
  if_false: yes -> check the packet files exist with all splits
- check: Has the packet reached REP_RESENT_LIMIT attempts?
  if_true: yes -> automatic resend stopped; manual resend needed
  if_false: no -> wait REP_RESENT_AWAIT_TIME_IN_MIN for the next attempt
solutions:
- id: SOL-IREP-DCS-003-A
  title: Restore the transfer path
  when: RepIntegration or RepTransfer down or unreachable.
  steps:
  - do: Start/restart RepIntegration and RepTransfer; check their logs.
    who: support
    requires_approval: true
    verify: TransferGeneral calls succeed.
  - do: Let auto resend and directory resend pick up the waiting packets.
    who: support
    requires_approval: false
    verify: Packets delivered; resend log shows success.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-IREP-DCS-003-B
  title: Recreate missing split files
  when: Resend finds no file or wrong split count.
  steps:
  - do: Dev decides whether to regenerate the packet; do not edit packet counters.
    who: dev
    requires_approval: true
    verify: Receiver gets a complete packet.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
