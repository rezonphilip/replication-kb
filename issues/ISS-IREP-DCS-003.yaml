id: ISS-IREP-DCS-003
title: 'sync+ export: packet transfer to RepIntegration/RepTransfer fails; resend'
status: draft
author: claude
reviewed_by: ''
last_verified: '2026-11-11'
mechanism:
- irep
runs_on:
- office
- vessel
components:
- ExportDCS
error_types:
- http
- transport
related_docs:
- CMP-EXPORTDCS
- CMP-REPINTEGRATION
- CMP-REPTRANSFER
- FLW-IREP-EXPORT
symptoms:
- Packets are created and recorded (OutPacketHd) but do not leave the server.
- Logs "Packet Transfer Failed for Vessel", "Error in transfering file", or "Transfer service not reachable for N consecutive attempts".
- The export still reports success; delivery depends on the auto resend and the hourly directory resend.
phrasings:
- packet transfer failed
- transfer service not reachable
- TransferGeneral failed
- dcs cannot send packet
- packets created but not sent
- resend failed
- auto resend not working
- directory resend not enabled
- no valid resend files
- file count does not match split count
- resend file not found
- irep packets stuck in outbox
- sync+ to smartsync handoff failed
- integration transfer general error
- rep transfer down irep
- resent limit reached
- packet not uploaded irep
- trasnfer faild
- outpackethd saved but not delivered
- packets not reaching vessel sync+
