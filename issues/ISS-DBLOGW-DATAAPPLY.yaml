distinguishing_checks:
- check: Identify table id/name from the log and compare the column list on both sides (sender query vs receiver table).
  if_true: column/type differs -> schema drift; align schema
  if_false: same -> check the query configuration for the table
- check: For change tracking errors, check that change tracking is enabled on the source database and table.
  if_true: not enabled -> enable it (DBA) and re-run
  if_false: enabled -> check the configured query text
