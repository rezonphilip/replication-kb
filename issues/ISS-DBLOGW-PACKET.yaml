distinguishing_checks:
- check: Open the error/incoming folder and check whether all split parts of the packet exist with the expected size.
  if_true: parts missing or zero size -> transfer incomplete; wait or request resend
  if_false: all parts present -> file is damaged or not meant for this site
- check: 'Read the packet name: unique code, destination, type and counter must match the receiving environment.'
  if_true: mismatch -> packet was routed to the wrong site; do not import
  if_false: match -> treat as corrupt and request resend
