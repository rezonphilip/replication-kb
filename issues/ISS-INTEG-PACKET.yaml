distinguishing_checks:
- check: Open the error/incoming folder and check whether all split parts of the packet exist with the expected size.
  if_true: parts missing or zero size -> transfer incomplete; wait or request resend
  if_false: all parts present -> file is damaged or not meant for this site
- check: 'Read the packet name: unique code, destination, type and counter must match the receiving environment.'
  if_true: mismatch -> packet was routed to the wrong site; do not import
  if_false: match -> treat as corrupt and request resend
solutions:
- id: SOL-INTEG-PACKET-A
  title: Request a clean resend of the packet
  when: The packet is incomplete or corrupt.
  steps:
  - do: Note vessel, packet name and counter from the log.
    who: support
    requires_approval: false
    verify: Details recorded.
  - do: Request a resend from the sending side and move the bad copy out of the inbox.
    who: dev
    requires_approval: true
    verify: New copy validates and imports.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-INTEG-PACKET-B
  title: Correct routing configuration
  when: The packet belongs to another site or replica type.
  steps:
  - do: Compare the destination and unique code in the name with the receiver configuration.
    who: dev
    requires_approval: false
    verify: Mismatch identified.
  - do: Fix the sender/receiver configuration (vessel object id, unique code).
    who: dev
    requires_approval: true
    verify: New packets carry the right destination.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
