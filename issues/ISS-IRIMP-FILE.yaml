distinguishing_checks:
- check: Check the folder from the log exists and the service account has modify rights.
  if_true: missing/no rights -> create folder or grant rights
  if_false: exists with rights -> check locks and disk space
- check: Check free disk space and whether antivirus/backup software locks the folder.
  if_true: full/locked -> free space or exclude folder
  if_false: ok -> configuration path may be wrong
solutions:
- id: SOL-IRIMP-FILE-A
  title: Fix folder, permissions or disk space
  when: Folder missing, no rights or disk full.
  steps:
  - do: Infrastructure creates the folder/grants rights/frees space.
    who: support
    requires_approval: true
    verify: Next cycle moves files.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-IRIMP-FILE-B
  title: Release locked files
  when: Another process holds the file.
  steps:
  - do: Identify the locking process and stop it or exclude the folder from scanning.
    who: support
    requires_approval: true
    verify: Lock cleared.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
