distinguishing_checks:
- check: Read the SQL message after the log text (procedure not found, invalid column, timeout, login failed, NULL into ID).
  if_true: object/column missing -> deployment scripts not applied (see data articles)
  if_false: timeout/deadlock -> load or blocking
- check: Check the service connection string target is the right database and reachable (names only).
  if_true: wrong/unreachable -> fix connection
  if_false: correct -> DBA checks blocking and object state
solutions:
- id: SOL-DBLOGW-DB-A
  title: Apply missing database scripts
  when: Procedure/column/default missing on this database.
  steps:
  - do: Compare deployed objects with the inventory for the version.
    who: dev
    requires_approval: false
    verify: Missing object identified.
  - do: Run the deployment script set for the site (office or vessel copy).
    who: dev
    requires_approval: true
    verify: Error no longer occurs.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-DBLOGW-DB-B
  title: Relieve load or blocking
  when: Timeouts or deadlocks.
  steps:
  - do: DBA identifies blocking sessions and long queries.
    who: dev
    requires_approval: true
    verify: Calls complete within timeout.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
