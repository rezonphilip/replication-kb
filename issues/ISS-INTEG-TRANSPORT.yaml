distinguishing_checks:
- check: Check network reachability from the server to Azure (storage and Service Bus endpoints) and whether other vessels transfer.
  if_true: only this site fails -> local network/firewall/proxy
  if_false: all sites fail -> Azure account, key or service side
- check: Run the read-only settings presence scripts (Azure/Service Bus) for the site.
  if_true: setting missing or empty -> restore configuration
  if_false: settings present -> look at storage/Service Bus access and quotas
solutions:
- id: SOL-INTEG-TRANSPORT-A
  title: Restore connectivity or credentials
  when: Network down or credentials invalid.
  steps:
  - do: Confirm network path and proxy rules with infrastructure.
    who: support
    requires_approval: false
    verify: Endpoint reachable.
  - do: Restore/rotate the storage or Service Bus credential in the configured source (never paste secrets in tickets).
    who: dev
    requires_approval: true
    verify: Next cycle uploads/downloads succeed.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-INTEG-TRANSPORT-B
  title: Let the queue drain
  when: Transient failure that has cleared.
  steps:
  - do: Watch the next cycles; failed items are retried by the service.
    who: support
    requires_approval: false
    verify: Queue count decreases.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
