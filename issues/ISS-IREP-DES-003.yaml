id: ISS-IREP-DES-003
title: 'sync+ import: rows rejected or skipped — schema mismatch between packet and replica table'
status: draft
author: claude
reviewed_by: ''
last_verified: '2026-11-11'
mechanism:
- irep
runs_on:
- office
- vessel
components:
- ImportDES
- ImportDSC
error_types:
- dataapply
related_docs:
- CMP-IMPORTDES
- CMP-IMPORTDSC
- DATA-IREP
symptoms:
- Some rows or tables do not arrive; logs "[DATA_SKIPPED] Skipping row ID", "Bulk write rejected row data", or "schema comparison failed".
- ImportDSC logs table create/alter failures or "Table doesnot exist on PAL".
phrasings:
- bulk write rejected rows
- data skipped row
- schema comparison failed
- replica table missing column
- table doesnot exist on pal
- create table in azure failed
- dsc failed
- column type mismatch irep
- rows skipped import
- some records missing on vessel sync+
- some records missing in office irep
- string truncated replica
- null into not null column
- GeneratePalTableSchema empty
- rep2i table not created
- schema drift sync+
- data_skipped
- bulk copy error irep
- colum mismatch
- staging table structure wrong
