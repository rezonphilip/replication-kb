distinguishing_checks:
- check: Read the column diagnostics in the "Bulk write rejected" line (table id, columns).
  if_true: type/length/null problem -> schema drift between sender table and replica table
  if_false: no diagnostics -> check ImportDSC log for the table
- check: Did ImportDSC succeed for the table id (create/alter)?
  if_true: no -> fix DSC failure first
  if_false: yes -> data problem in specific rows
solutions:
- id: SOL-IREP-DES-003-A
  title: Align schema and reprocess
  when: Replica/staging table differs from source.
  steps:
  - do: Dev compares source and replica schema for the table id.
    who: dev
    requires_approval: false
    verify: Difference identified.
  - do: Apply schema fix (DSC re-run or script) and reprocess skipped rows via the documented reprocess route.
    who: dev
    requires_approval: true
    verify: Skipped rows applied; no new rejection.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
