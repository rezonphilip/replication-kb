id: ISS-IREP-DES-002
title: 'sync+ import: incorrect or missing packet counter — vessel skipped until next cycle'
status: draft
author: claude
reviewed_by: ''
last_verified: '2026-11-11'
mechanism:
- irep
runs_on:
- office
- vessel
components:
- ImportDES
error_types:
- sequence
related_docs:
- CMP-IMPORTDES
- FLW-IREP-IMPORT
- DATA-IREP
symptoms:
- Import stops for one vessel; later packets wait in the inbox.
- Warnings "Incorrect packet counter … received for vessel" and "Skipping the vessel … untill next cycle".
phrasings:
- incorrect packet counter
- packet counter mismatch irep
- missing packet sync+
- vessel skipped until next cycle
- later packets waiting
- packet gap des
- packet counter updation failed
- error packet counter cache list
- no valid packet counter
- packet counter 0
- out of order packet irep
- missing packet status
- last in packet counter wrong
- import stuck one vessel
- sequnce error import
- resend missing packet irep
- packet counter clear failed
- skipped vessel des
- counter not continuous
- packet lost in transit
