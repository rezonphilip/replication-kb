distinguishing_checks:
- check: Compare the last applied in-packet counter for the vessel with the counters waiting in the inbox (read-only).
  if_true: gap -> the missing counter must be resent
  if_false: no gap -> counter update failed in DB; see IRIMP-DB
- check: Is the missing packet in the error folder or skip table?
  if_true: yes -> fix that packet (ISS-IREP-DES-001/003)
  if_false: no -> request resend from the sender (sender auto resend may be exhausted)
solutions:
- id: SOL-IREP-DES-002-A
  title: Get the missing counter re-sent
  when: Packet never arrived or was rejected.
  steps:
  - do: Identify vessel and first missing counter.
    who: support
    requires_approval: false
    verify: Counter known.
  - do: Trigger resend on the sending ExportDCS (resend route / auto resend log).
    who: dev
    requires_approval: true
    verify: Missing packet arrives; later packets import.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
notes: Warnings are hidden at the default Error level.
