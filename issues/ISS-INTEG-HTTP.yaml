distinguishing_checks:
- check: Call the target service health/version route from the calling server.
  if_true: unreachable -> service stopped or address wrong
  if_false: reachable -> look at the target service log for the same time
- check: Compare the configured endpoint (services.json / microservices.json / settings table) with the actual route.
  if_true: mismatch -> fix the endpoint
  if_false: match -> target-side failure
solutions:
- id: SOL-INTEG-HTTP-A
  title: Restore the target service
  when: Target stopped, crashed or overloaded.
  steps:
  - do: Start/restart the target service (IIS/Windows service) and check its log.
    who: support
    requires_approval: true
    verify: Health/version route answers.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-INTEG-HTTP-B
  title: Correct the endpoint configuration
  when: Wrong base address or route.
  steps:
  - do: Fix the endpoint in the configuration source.
    who: dev
    requires_approval: true
    verify: Next call succeeds.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
