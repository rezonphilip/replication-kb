distinguishing_checks:
- check: Look for the last successful cycle line and any "already running", "time exceeded" or crash line in IntegrationServiceLog_.txt.
  if_true: flag/time line found -> in-memory running flag or wait timer is blocking
  if_false: nothing logged -> check that the worker is enabled and the interval setting is not zero
- check: Check whether a long database call or HTTP call is still running (SQL activity, service response).
  if_true: still running -> wait for timeout before restarting
  if_false: nothing running -> the flag is stale
solutions:
- id: SOL-INTEG-STUCK-A
  title: Clear a stale running flag
  when: The run ended abnormally and the in-memory flag was not cleared.
  steps:
  - do: Use the service clear/reset route if available, otherwise restart the service in a quiet period.
    who: support
    requires_approval: true
    verify: Next cycle logs a start and progress.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
- id: SOL-INTEG-STUCK-B
  title: Fix scheduler settings
  when: Worker disabled or interval misconfigured.
  steps:
  - do: Check the WorkerServiceSettings/BasicSettings interval and enable flags (names only).
    who: dev
    requires_approval: true
    verify: Worker runs on schedule.
  escalate_if: The failure repeats after the fix, or the cause is not covered by the checks above.
